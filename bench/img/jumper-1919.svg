<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Adafruit #1919 jumper: one 2.0 mm housing, two wires</title>
<desc>Each 2.0 mm housing holds two wires that end in separate 2.54 mm sockets. A housing fits along a column or across the rows of J2; across pins 7 and 8 its second wire would land on 5 V.</desc>
<rect x="0.5" y="0.5" width="879" height="339" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="40" font-size="15" text-anchor="start" fill="#1f2328" font-weight="600">One #1919 pair</text>
<text x="40" y="74" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">2.0 mm end</text>
<text x="40" y="90" font-size="12" text-anchor="start" fill="#57606a">one housing holds two wires</text>
<path d="M 78,118 C 160,118 220,98 300,98" fill="none" stroke="#1f2328" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
<path d="M 78,118 C 160,118 220,98 300,98" fill="none" stroke="#6e7781" stroke-width="4" stroke-linecap="round"/>
<path d="M 78,146 C 160,146 220,166 300,166" fill="none" stroke="#1f2328" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
<path d="M 78,146 C 160,146 220,166 300,166" fill="none" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
<rect x="50" y="104" width="28" height="56" rx="3" fill="#1f2328"/>
<circle cx="64" cy="118" r="4" fill="#ffffff"/>
<circle cx="64" cy="146" r="4" fill="#ffffff"/>
<rect x="300" y="90" width="44" height="16" rx="2" fill="#1f2328"/>
<rect x="336" y="95" width="6" height="6" fill="#ffffff"/>
<rect x="300" y="158" width="44" height="16" rx="2" fill="#1f2328"/>
<rect x="336" y="163" width="6" height="6" fill="#ffffff"/>
<text x="300" y="204" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">2.54 mm ends</text>
<text x="300" y="220" font-size="12" text-anchor="start" fill="#57606a">one socket per wire</text>
<line x1="200" y1="159" x2="200" y2="180" stroke="#57606a" stroke-width="1.2"/>
<rect x="184" y="180" width="34" height="22" rx="2" fill="#fff8c5" stroke="#9a6700"/>
<text x="201" y="196" font-size="13" text-anchor="middle" fill="#1f2328" font-weight="700" font-family="Consolas, Menlo, monospace">9</text>
<text x="40" y="262" font-size="12" text-anchor="start" fill="#1f2328">Flag each wire with tape and write</text>
<text x="40" y="278" font-size="12" text-anchor="start" fill="#1f2328">its J2 pin number on the flag.</text>
<line x1="440" y1="24" x2="440" y2="330" stroke="#d0d7de"/>
<text x="460" y="40" font-size="15" text-anchor="start" fill="#1f2328" font-weight="600">Fitting a housing on J2</text>
<rect x="498" y="82" width="64" height="126" rx="3" fill="#f6f8fa" stroke="#6e7781"/>
<circle cx="515" cy="100" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="545" cy="100" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="515" cy="130" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="545" cy="130" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="515" cy="160" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="545" cy="160" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="515" cy="190" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="545" cy="190" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<rect x="533" y="118" width="24" height="54" rx="4" fill="#1f2328" fill-opacity="0.30" stroke="#1f2328" stroke-width="2.5"/>
<text x="530" y="234" font-size="12.5" text-anchor="middle" fill="#1f2328" font-weight="600">Along a column</text>
<text x="530" y="250" font-size="12" text-anchor="middle" fill="#57606a">housings A, D, E</text>
<rect x="638" y="82" width="64" height="126" rx="3" fill="#f6f8fa" stroke="#6e7781"/>
<circle cx="655" cy="100" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="685" cy="100" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="655" cy="130" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="685" cy="130" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="655" cy="160" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="685" cy="160" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="655" cy="190" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="685" cy="190" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<rect x="643" y="118" width="54" height="24" rx="4" fill="#1f2328" fill-opacity="0.30" stroke="#1f2328" stroke-width="2.5"/>
<text x="670" y="234" font-size="12.5" text-anchor="middle" fill="#1f2328" font-weight="600">Across the rows</text>
<text x="670" y="250" font-size="12" text-anchor="middle" fill="#57606a">housings B, C</text>
<rect x="778" y="82" width="64" height="126" rx="3" fill="#f6f8fa" stroke="#6e7781"/>
<circle cx="795" cy="100" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="825" cy="100" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="795" cy="130" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="825" cy="130" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="795" cy="160" r="5" fill="#cf222e" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="825" cy="160" r="5" fill="#1f2328" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="795" cy="190" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<circle cx="825" cy="190" r="5" fill="#afb8c1" stroke="#1f2328" stroke-width="0.8"/>
<rect x="783" y="148" width="54" height="24" rx="4" fill="#1f2328" fill-opacity="0.30" stroke="#1f2328" stroke-width="2.5"/>
<text x="773" y="164" font-size="12" text-anchor="end" fill="#cf222e" font-weight="700" font-family="Consolas, Menlo, monospace">8</text>
<text x="847" y="164" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" font-family="Consolas, Menlo, monospace">7</text>
<path d="M 780,136 L 840,184 M 840,136 L 780,184" stroke="#cf222e" stroke-width="4" stroke-linecap="round"/>
<text x="810" y="234" font-size="12.5" text-anchor="middle" fill="#cf222e" font-weight="600">Not across 7 and 8</text>
<text x="810" y="250" font-size="12" text-anchor="middle" fill="#57606a">2nd wire lands on 5 V</text>
<text x="460" y="290" font-size="12" text-anchor="start" fill="#1f2328">Both wires of a housing always connect. Fit it only where both</text>
<text x="460" y="306" font-size="12" text-anchor="start" fill="#1f2328">pins are wanted, or where the spare pin is GND (pin 40).</text>
</svg>
