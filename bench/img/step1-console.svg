<text x="874" y="318" font-size="12" text-anchor="start" fill="#9a6700">leave empty</text>
<text x="812" y="344" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" font-family="Consolas, Menlo, monospace">11</text>
<text x="838" y="344" font-size="12" text-anchor="start" fill="#1f2328">UART2_TXD ← yellow</text>
<text x="812" y="364" font-size="12" text-anchor="start" fill="#1f2328" font-weight="700" font-family="Consolas, Menlo, monospace">9</text>
<text x="829" y="364" font-size="12" text-anchor="start" fill="#1f2328">UART2_RXD ← orange</text>
<text x="812" y="394" font-size="12" text-anchor="start" fill="#cf222e" font-weight="700" font-family="Consolas, Menlo, monospace">6, 8</text>
<text x="856" y="394" font-size="12" text-anchor="start" fill="#cf222e">5 V: nothing here</text>
<rect x="30" y="414" width="590" height="108" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="48" y="440" font-size="13" text-anchor="start" fill="#1f2328" font-weight="600">Power goes on last</text>
<text x="48" y="462" font-size="12" text-anchor="start" fill="#1f2328">Card A goes in the microSD slot first. Nothing connects to OTG or to the probe&#x27;s D port.</text>
<text x="48" y="482" font-size="12" text-anchor="start" fill="#1f2328">Then plug the 5.1 V 3 A USB-C supply into the PWR port on the board&#x27;s left edge.</text>
<text x="48" y="502" font-size="12" text-anchor="start" fill="#1f2328">Power off (unplug PWR) before you touch any wire.</text>
