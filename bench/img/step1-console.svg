<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Step 1 wiring: Debug Probe UART to DEBIX J2</title>
<desc>The PC connects to the Debug Probe over USB. The probe&#x27;s U port lead plugs into three #1919 wires: orange to J2 pin 9, yellow to pin 11, black to pin 39. The housing on 39 and 40 leaves pin 40&#x27;s wire spare.</desc>
