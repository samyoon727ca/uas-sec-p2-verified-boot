<text x="838" y="56" font-size="12" text-anchor="start" fill="#1f2328">GND ← black</text>
<text x="812" y="74" font-size="12" text-anchor="start" fill="#57606a" font-weight="700" font-family="Consolas, Menlo, monospace">40</text>
<text x="838" y="74" font-size="12" text-anchor="start" fill="#57606a">GND: spare wire</text>
